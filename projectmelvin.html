<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
           
        }

        body {
            background-color: #e0f2ff; 
            min-height: 100vh;
        }

        .header-bar {
            background-color: #1a3b70;
            padding: 12px 20px;
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
        }

        .nav-menu {
            display: flex;
            gap: 30px; 
        }

        .nav-menu a {
            color: #ffffff;
            font-size: 15px;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .nav-menu a:hover {
            opacity: 0.7; 
        }

        .section-title {
            text-align: center;
            font-size: 17px;
            margin-bottom: 50px;
            color: #1a3b70;
        }

        .project-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px; 
            flex-wrap: nowrap; 
            padding: 0 20px;
            width: 100%;
        }

        
        .project-card {
            background-color: #1a3b70;
            width: 110px;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 10px;
            font-size: 12px;
            color: #ffffff;
            text-align: left;
            flex-shrink: 0; 
        }

        .project-card h3 {
            font-size: 13px;
            margin-bottom: 5px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="logo">Portofolio</div>
        <nav class="nav-menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Project</a>
        </nav>
    </div>

    <h2 class="section-title">Project</h2>

    <div class="project-container">
        <div class="project-card">
            <h3>Projek</h3>
        </div>
        <div class="project-card">
            <h3>Projek</h3>
        </div>
        <div class="project-card">
            <h3>Projek</h3>
        </div>
    </div>

</body>
</html>
